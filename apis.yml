  description: The Chili Piper Edge API is the bearer-token REST surface for a Chili Piper organization, served at https://fire.chilipiper.com/api/fire-edge. It covers tenant and health, users, workspaces, teams, routing rules, distributions, meetings and meeting types, scheduling links (personal, round-robin, admin one-on-one, group and ownership), handoff routing, Distro routers and Concierge routing and logs. API access tokens are generated per organization in Command Center with per-section permissions (Ping, Read, Modify, Remove).
