- aid: chili-piper:mcp
  name: Chili Piper MCP Server
  description: Official hosted remote MCP server for Chili Piper, served over streamable HTTP at https://fire.chilipiper.com/api/fire-edge/v1/org/mcp. Supports OAuth (Admin, browser-based) and API-key bearer authentication, and exposes 55 documented tools across organization, users, workspaces, teams, distributions, rules, meetings, scheduling, handoff, Concierge, Distro and CRM. Tool calls are scoped to the authenticated tenant.
  humanURL: https://help.chilipiper.com/hc/en-us/articles/50430350863635-How-do-I-connect-Chili-Piper-via-MCP
  baseURL: https://fire.chilipiper.com/api/fire-edge/v1/org/mcp
