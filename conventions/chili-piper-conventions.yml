  headers: null
  evidence: >-
    No rate-limit policy, quota or 429 response is documented in the help center or declared in any
    published OpenAPI document. Chili Piper does document Salesforce/HubSpot API limit alerts, but
    those are the CRM vendor limits, not Chili Piper Edge API limits.
request_tracing:
  request_id_header: null
  documented: false
concurrency:
  optimistic_concurrency: true
  scope: 'Routing rules - rule-modify is documented as replacing rule name/conditions using optimistic concurrency control.'
async_operations:
  present: true
  note: 'Distro router lifecycle operations use async status polling (documented in the distro-router-configuration skill).'
two_phase_flows:
  description: >-
    Booking is a deliberate two-call contract across three surfaces. Phase 1 initializes a session
    and returns available slots; phase 2 books one of those slots against the session id.
  flows:
    - {name: scheduling link, phase_1: scheduling-link-init, phase_2: scheduling-link-schedule}
    - {name: handoff, phase_1: handoff-init, phase_2: handoff-schedule}
    - {name: concierge, phase_1: 'concierge-route / concierge-route-by-slug (with interval)', phase_2: concierge-schedule}
  note: >-
    Passing an interval to a Concierge route call switches it from returning a redirect routingLink
    to returning bookable startTimes plus a routingId for the second call.
