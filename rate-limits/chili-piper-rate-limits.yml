description: >-
  Chili Piper publishes NO rate limit for the Edge API. This is an honest zero, not an unchecked
  gap: the 19 published OpenAPI 3.1.0 documents declare only 400 and default responses and contain
  no 429 anywhere, the help-center Edge API reference states no quota or throttle policy, and no
  RateLimit-* / X-RateLimit-* / Retry-After response header is documented or declared. An agent
  calling this API has no published runtime signal telling it when it is close to a limit, and no
  documented status code to branch on when it exceeds one.
