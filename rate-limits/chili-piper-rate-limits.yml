crm_limits_note: >-
  Chili Piper documents Salesforce and HubSpot API limit alerts in its help center. Those are the
  CRM vendors' limits on Chili Piper's own downstream integration traffic, NOT limits on the Chili
  Piper Edge API, and must not be recorded as Chili Piper rate limits.
