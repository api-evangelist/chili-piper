  /v1/org/schedulingLinks/group:
    post:
      tags:
      - Scheduling Links
      summary: Create group scheduling link
      description: '[operation: scheduling-link-create-group]


        MUTATING


        Creates a group scheduling link — a meeting with a fixed host plus additional members. Offered slots are the intersection of the host and required members'' availability; optional members are invited but do not gate availability.


        - slug: URL slug (lowercase letters, digits, hyphens, underscores).


        - hostUserId: the host user; use user-find.


        - sharedWith (opt): sharing scope, {type: "Workspace"} (default) or {type: "Teams", teamIds}.


        →


        {workspaceId, linkId, name, slug, meetingTypeIds, bookingUrl}


        see: user-find (resolve user ids), scheduling-link-list-group (browse existing)'
      operationId: schedulingLinkCreateGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupLinkCreate'
        required: true
      responses:
        '200':
          description: ''
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            X-Robots-Tag:
              required: true
              schema:
                type: string
            Pragma:
              required: true
              schema:
                type: string
            Expires:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSchedulingLinkDetail'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          headers:
            Location:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - errorCode
                - errorMessage
                properties:
                  errorCode:
                    type: string
                  errorMessage:
                    type: string
                  arguments:
                    $ref: '#/components/schemas/Map_String'
      security:
      - apiKeyAuth: []
      X-Chili-Required-Permissions:
      - scheduling-links.create
    servers:
    - url: https://fire.chilipiper.com/api/fire-edge
      description: Production
  /v1/org/schedulingLinks/group/{linkId}:
    put:
      tags:
      - Scheduling Links
      summary: Update group scheduling link
      description: '[operation: scheduling-link-update-group]


        MUTATING — IDEMPOTENT


        Patches a group scheduling link. Send only the fields you want to change; omitted fields keep their current value. Passing requiredMemberIds or optionalMemberIds replaces that member list wholesale.


        →


        {workspaceId, linkId, name, slug, meetingTypeIds, bookingUrl}


        ⚠ takes effect immediately


        see: user-find (resolve user ids), scheduling-link-list-group (find a linkId)'
      operationId: schedulingLinkUpdateGroup
      parameters:
      - name: linkId
        in: path
