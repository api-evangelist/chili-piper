generated: '2026-08-13'
method: searched
source: https://registry.npmjs.org/
checked: '2026-08-13'
notes: >-
  Chili Piper publishes first-party browser embed libraries under the @chilipiper npm scope. No
  first-party server-side SDK was found on PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems,
  Packagist or crates.io - the Edge API is consumed directly over HTTPS with a bearer token.
currency_finding: >-
  Both first-party npm packages are stale relative to the API they front. The current Concierge
  distribution (@chilipiper/conciergejs-fire) last published 2025-10-03 and the older
  @chilipiper/concierge last published 2025-02-13 - roughly 10 and 18 months before this check,
  while the Edge API and MCP agent surface shipped changes as recently as 2026-08 (see
  changelog/chili-piper-changelog.yml). Chili Piper's developer investment is visibly going into the
  MCP/agent surface rather than the browser embed packages.
repository_finding: >-
  Both packages declare repository git+ssh://git@github.com/Chili-Piper/concierge.git and homepage
  https://github.com/Chili-Piper/concierge#readme, but that repository returns HTTP 404 - it is
  private or deleted, and it does not appear among the 15 public repos in the Chili-Piper GitHub
  org. A consumer following the published source link from npm reaches a dead page.
