description: >-
  Chili Piper publishes list pricing publicly - unusually for a B2B GTM platform, the numbers are on
  the pricing page and repeated verbatim in the company's own machine-readable llms.txt. Pricing is
  platform-tier based (not API-metered): there is no developer plan, no free tier, no API call quota
  and no separate charge for Edge API or MCP access. Every tier is seat-based with a floor of
  included seats and a published per-seat overage rate; the Edge API and the hosted MCP server are
  included with the platform subscription rather than sold separately.
